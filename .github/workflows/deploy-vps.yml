name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Publish Docker Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Preflight SSH connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST}" ]; then
            echo "::error::VPS_HOST secret is empty."
            exit 1
          fi

          if [[ "${VPS_HOST}" == *"://"* ]]; then
            echo "::error::VPS_HOST must be a raw host/IP (no protocol prefix)."
            exit 1
          fi

          echo "Checking TCP reachability to ${VPS_HOST}:${VPS_PORT}..."
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${VPS_PORT}" 2>/dev/null; then
            echo "::error::Cannot reach ${VPS_HOST}:${VPS_PORT} from GitHub runner."
            echo "::error::Verify VPS_HOST / VPS_SSH_PORT, VPS firewall/ufw, provider security groups, and fail2ban."
            exit 1
          fi

      - name: Deploy latest Docker image on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/portfolio_2026:latest"
            CONTAINER_NAME="${{ secrets.VPS_CONTAINER_NAME }}"
            ENV_FILE_PATH="${{ secrets.VPS_ENV_FILE_PATH }}"
            SERVICES_TO_STOP="${{ secrets.VPS_STOP_SERVICES }}"

            if [ -z "${CONTAINER_NAME}" ]; then
              CONTAINER_NAME="portfolio"
            fi

            if [ -z "${ENV_FILE_PATH}" ]; then
              ENV_FILE_PATH="/root/pasan/.env"
            fi

            if [ -z "${SERVICES_TO_STOP}" ]; then
              SERVICES_TO_STOP="nginx apache2 httpd caddy"
            fi

            if [ ! -f "${ENV_FILE_PATH}" ]; then
              echo "Env file not found: ${ENV_FILE_PATH}"
              exit 1
            fi

            port_80_in_use() {
              if command -v ss >/dev/null 2>&1; then
                ss -ltnH '( sport = :80 )' | grep -q .
                return
              fi
              if command -v lsof >/dev/null 2>&1; then
                lsof -iTCP:80 -sTCP:LISTEN -t >/dev/null
                return
              fi
              if command -v netstat >/dev/null 2>&1; then
                netstat -ltn 2>/dev/null | awk '$4 ~ /:80$/ {found=1} END{exit found ? 0 : 1}'
                return
              fi
              return 1
            }

            print_port_80_listeners() {
              if command -v ss >/dev/null 2>&1; then
                ss -ltnp '( sport = :80 )' || true
                return
              fi
              if command -v lsof >/dev/null 2>&1; then
                lsof -nP -iTCP:80 -sTCP:LISTEN || true
                return
              fi
              if command -v netstat >/dev/null 2>&1; then
                netstat -ltnp 2>/dev/null | awk '$4 ~ /:80$/' || true
                return
              fi
              echo "No listener inspection tool available (ss/lsof/netstat)."
            }

            docker stop "${CONTAINER_NAME}" || true
            docker rm "${CONTAINER_NAME}" || true
            docker image rm -f "${IMAGE}" || true

            CONFLICTING_CONTAINERS="$(docker ps --filter "publish=80" --format '{{.ID}} {{.Names}}')"
            if [ -n "${CONFLICTING_CONTAINERS}" ]; then
              echo "${CONFLICTING_CONTAINERS}" | while read -r CID CNAME; do
                if [ -z "${CID}" ]; then
                  continue
                fi
                echo "Stopping container using host port 80: ${CNAME} (${CID})"
                docker stop "${CID}" || true
                docker rm "${CID}" || true
              done
            fi

            if port_80_in_use; then
              echo "Port 80 is still in use. Attempting to stop system services: ${SERVICES_TO_STOP}"
              for service_name in ${SERVICES_TO_STOP}; do
                if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q "^${service_name}"; then
                  if systemctl is-active --quiet "${service_name}"; then
                    echo "Stopping ${service_name}..."
                    systemctl stop "${service_name}" || true
                  fi
                elif command -v service >/dev/null 2>&1; then
                  service "${service_name}" stop || true
                fi
              done
            fi

            if port_80_in_use; then
              echo "Port 80 is still busy after container/service cleanup."
              echo "Listeners on 80:"
              print_port_80_listeners
              echo "Running containers:"
              docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}'
              exit 1
            fi

            docker pull "${IMAGE}"

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --env-file "${ENV_FILE_PATH}" \
              -p 80:80 \
              "${IMAGE}"

            for i in $(seq 1 20); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${CONTAINER_NAME}")"
              if [ "${STATUS}" = "healthy" ] || [ "${STATUS}" = "running" ]; then
                break
              fi
              sleep 2
            done

            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${CONTAINER_NAME}")"
            if [ "${STATUS}" != "healthy" ] && [ "${STATUS}" != "running" ]; then
              docker logs --tail 80 "${CONTAINER_NAME}" || true
              exit 1
            fi

            docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
